name: Build TiPro App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile and Package TIA
        run: npm run package

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSAB-TiPro-Package
          path: ./*.tia
          if-no-files-found: error
